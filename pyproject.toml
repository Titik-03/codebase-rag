[project]
name = "rag-against-the-machine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mohamed Esseddik Gamal", email = "titikmedgamal@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.15.0",
    "fastapi>=0.162.0",
    "fire>=0.7.1",
    "pydantic>=2.13.5",
    "python-multipart>=0.0.32",
    "sentence-transformers>=6.2.0",
    "torch>=2.14.0",
    "tqdm>=4.70.1",
    "transformers",
    "uvicorn>=0.54.0",
]

[project.scripts]
rag-against-the-machine = "rag_against_the_machine:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
[tool.uv]
package = false
