[project]
name = "rag-against-the-machine"
version = "0.1.0"
description = "Local retrieval-augmented generation for the vLLM codebase"
readme = "README.md"
authors = [
    { name = "Mohamed Esseddik Gamal", email = "titikmedgamal@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.15.0",
    "fastapi>=0.162.0",
    "fire>=0.7.1",
    "pydantic>=2.13.5",
    "python-multipart>=0.0.32",
    "sentence-transformers[openvino]>=6.2.0",
    "torch>=2.14.0",
    "tqdm>=4.70.1",
    "transformers",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
[tool.uv]
package = false

[tool.mypy]
exclude = '(^|/)(\.venv|data|evaluations|exams|chubbik-lubbik|build|dist)/'

[[tool.mypy.overrides]]
module = ["torch.*", "transformers.*", "sentence_transformers.*", "fastapi.*"]
follow_imports = "skip"

[dependency-groups]
dev = [
    "flake8>=7.5.0",
    "mypy>=2.4.1",
]
